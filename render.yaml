# Render Blueprint: New -> Blueprint -> pick this repo. Then fill in the keys in the dashboard.
services:
  - type: web
    name: citecheck
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REPORTS_PER_HOUR
        value: "5"
      - key: SOURCE_URL
        value: https://github.com/mathi1322/citechecker
