[project]
name = "citecheck"
version = "0.1.0"
description = "Check whether AI search engines cite your website, who they cite instead, and what to fix."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "selectolax>=1.0",
    "tldextract>=5.1",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ui: browser tests (need `uv run playwright install chromium`)",
    "live: calls the real Gemini API (needs GEMINI_API_KEY and RUN_LIVE=1)",
]
addopts = "-ra -m 'not live'"
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
